#
# Fplus T1100: MT6358 codec -> external analog speaker amplifier (GPIO159).
#
Syntax 3

SectionVerb {
	Value {
		TQDM 1
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker"

	EnableSequence [
		# AFE -> ADDA: stereo pair DL1 -> ADDA
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		# codec path: AIF -> DAC -> loudspeaker outputs
		cset "name='DAC In Mux' 'Normal Path'"
		cset "name='HPL Mux' 'LoudSPK Playback'"
		cset "name='HPR Mux' 'LoudSPK Playback'"
	]

	DisableSequence [
		cset "name='HPL Mux' 'Open'"
		cset "name='HPR Mux' 'Open'"
		cset "name='ADDA_DL_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 0"
	]

	Value {
		PlaybackPCM "hw:0,0"
		PlaybackChannels 2
		PlaybackPriority 100
	}
}
