# WMT (Wireless Management Task) configuration for the MT6631 combo on MT6771.
#
# The vendor stack reads this file through request_firmware() during
# wmt_lib_init() and refuses to start without it (wmt_conf_read_file() returns
# -1 -> WMT_init() fails -> no CONSYS probe at all). MediaTek ships it as
# /vendor/firmware/WMT_SOC.cfg; it is pure configuration, not a blob, so it is
# kept here as a plain text file.
#
# Format: one "key = value" per line, '#' has no special meaning (a line
# without '=' is reported as mal-format and skipped), unknown keys warn and do
# not fail the parse. Every field has a built-in default, so only the values we
# actually care about are spelled out.

# Antenna sharing between BT and Wi-Fi: 0 = no external PTA/ELNA (the T1100
# uses the internal 1x1 antenna arrangement of the MT6631).
coex_wmt_ant_mode = 0
coex_wmt_ant_mode_ex = 0
coex_wmt_ext_component = 0
coex_wmt_filter_mode = 0

# Coexistence thresholds, vendor defaults.
coex_bt_rssi_upper_limit = 0
coex_bt_rssi_mid_limit = 0
coex_bt_rssi_lower_limit = 0
coex_bt_pwr_high = 0
coex_bt_pwr_mid = 0
coex_bt_pwr_low = 0

coex_wifi_rssi_upper_limit = 0
coex_wifi_rssi_mid_limit = 0
coex_wifi_rssi_lower_limit = 0
coex_wifi_pwr_high = 0
coex_wifi_pwr_mid = 0
coex_wifi_pwr_low = 0

# No external PTA front-end.
coex_ext_pta_hi_tx_tag = 0
coex_ext_pta_hi_rx_tag = 0
coex_ext_pta_lo_tx_tag = 0
coex_ext_pta_lo_rx_tag = 0
coex_ext_pta_sample_t1 = 0
coex_ext_pta_sample_t2 = 0
coex_ext_pta_wifi_bt_con_trx = 0
coex_misc_ext_pta_on = 0
coex_misc_ext_feature_set = 0

# GPS LNA is not wired on this board.
wmt_gps_lna_pin = 0
wmt_gps_lna_enable = 0

# Power-on timing: 0 = let the driver use the default slot numbers.
pwr_on_rtc_slot = 0
pwr_on_ldo_slot = 0
pwr_on_rst_slot = 0
pwr_on_off_slot = 0
pwr_on_on_slot = 0

# co_clock_flag: 0 = the combo takes its reference from the PMIC clock buffer
# (XO_WCN), which is what the stock device tree describes for this board.
co_clock_flag = 0

disable_deep_sleep_cfg = 0

# No SDIO on MT6771 (AHB/WFDMA only), so the SDIO driving strength is moot.
sdio_driving_cfg = 0

coex_wmt_wifi_path = 0
coex_wmt_ext_elna_gain_p1_support = 0
coex_wmt_ext_elna_gain_p1_D0 = 0
coex_wmt_ext_elna_gain_p1_D1 = 0
coex_wmt_ext_elna_gain_p1_D2 = 0
coex_wmt_ext_elna_gain_p1_D3 = 0
coex_wmt_ext_epa_mode = 0
bt_tssi_from_wifi = 0
bt_tssi_target = 0
