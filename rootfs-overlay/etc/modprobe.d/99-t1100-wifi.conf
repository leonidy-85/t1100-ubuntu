# T1100: CONSYS/MT6631 (внутренний Wi-Fi) — параметры вендорских модулей.
# Описание и проверки — docs/wifi-port-log.md §86–§87, сводка — docs/STATUS.md
# «16.11 (4)…(5)».
#
# wmt_drv:
#   t1100_btif_stp=1   поднять STP поверх BTIF и включить CONSYS из ядра (иначе
#                      это делал бы отсутствующий userspace-launcher);
#   t1100_quiet_ms=100 тихое окно после последнего фрагмента ROMv4-патча;
#   t1100_rom_patch    два файла из /lib/firmware, стоковый порядок: сначала
#                      1_1, затем 1_0 (пустое значение = спрашивать userspace).
options wmt_drv t1100_btif_stp=1 t1100_quiet_ms=100 t1100_rom_patch="ROMv4_be_patch_1_1_hdr.bin ROMv4_be_patch_1_0_hdr.bin soc3_0_ram_mcu_e1_hdr.bin"
#
# wlan_drv_gen3:
#   t1100_probe=0          только зарегистрировать callback, probe запускает
#                          ioctl из t1100-wifi.service;
#   t1100_rom_patch_mcif=0 ROMv4-патч уже залит через wmt_drv;
#   t1100_pwr_on_done=1    CONSYS включён, повторно не включать.
# t1100_post_ready намеренно НЕ включается: сразу после READY он делает лишний
# driver-own/FW-own, FW отдаёт MCR_WASR 0x10000 и уходит в Whole chip reset (§87).
options wlan_drv_gen3 t1100_probe=0 t1100_rom_patch_mcif=0 t1100_pwr_on_done=1 t1100_no_fw_own=0
