[Service]
# Путь к файлу настроек лимитов (AUTO_IAICR_UA / AUTO_ICHG_UA / PD_*_CAP_UA).
# Drop-in нужен, чтобы было видно, откуда юнит берёт значения, и чтобы на
# конкретной плате можно было зафиксировать другой профиль, не трогая юнит:
#
#   mkdir -p /etc/systemd/system/t1100-charge.service.d
#   cat >/etc/systemd/system/t1100-charge.service.d/20-pinned.conf <<'EOF'
#   [Service]
#   Environment=T1100_CHARGE_DEF=/etc/default/t1100-charge.pinned
#   EOF
#   systemctl daemon-reload && systemctl restart t1100-charge
Environment=T1100_CHARGE_DEF=/etc/default/t1100-charge
